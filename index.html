<style>
:root{
  --bg:#EEF0F5; --surface:#FFFFFF; --surface2:#E6E9F0; --line:#D5DAE3; --line2:#C4CAD6;
  --text:#141927; --muted:#5B6476; --accent:#B4700A; --accent-soft:#F6E7C7; --accent-ink:#FFFFFF;
  --good:#237A4A; --good-soft:#D9F0E2; --warn:#B4700A; --bad:#B3362F; --bad-soft:#F8DEDC;
  --shadow:0 1px 2px rgba(20,25,39,.06),0 6px 18px rgba(20,25,39,.06);
  --r:14px; --r2:10px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark;
  --bg:#0F1420; --surface:#171D2B; --surface2:#1F2738; --line:#2A3448; --line2:#364158;
  --text:#ECEFF5; --muted:#8C95A8; --accent:#F2B544; --accent-soft:#3A2F14; --accent-ink:#141927;
  --good:#5FC78E; --good-soft:#15301F; --warn:#F2B544; --bad:#F27F77; --bad-soft:#3A1B19;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); } }
:root[data-theme="dark"]{ color-scheme:dark;
  --bg:#0F1420; --surface:#171D2B; --surface2:#1F2738; --line:#2A3448; --line2:#364158;
  --text:#ECEFF5; --muted:#8C95A8; --accent:#F2B544; --accent-soft:#3A2F14; --accent-ink:#141927;
  --good:#5FC78E; --good-soft:#15301F; --warn:#F2B544; --bad:#F27F77; --bad-soft:#3A1B19;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.app{max-width:600px;margin:0 auto;padding:12px 14px 120px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input,select,textarea{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r2);padding:10px 12px;width:100%;min-height:44px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r2);padding:11px 14px;min-height:46px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.small{padding:6px 10px;min-height:34px;font-size:14px;font-weight:500}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font-size:17px;font-weight:700}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.m{color:var(--muted)} .small{font-size:14px} .tiny{font-size:13px}
.good{color:var(--good)} .warn{color:var(--warn)} .bad{color:var(--bad)}
h1.big{font-size:40px;line-height:.95;font-weight:900;font-stretch:80%;letter-spacing:-.02em;margin:6px 0 6px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.top .back{background:none;border:none;padding:6px 8px 6px 0;color:var(--accent);font-weight:700;min-height:40px}
.list{margin:0;padding:0;list-style:none}
.list li{padding:11px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:none}
.list li.tap{cursor:pointer}
.list .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.empty{color:var(--muted);padding:6px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:transparent;border-radius:999px;padding:7px 13px;font-size:14px;min-height:36px}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.pill{display:inline-block;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;background:var(--surface2);color:var(--muted)}
.pill.s{background:var(--accent-soft);color:var(--accent)}
.pill.v{background:var(--good-soft);color:var(--good)}
/* hero */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px 16px 20px;margin-bottom:12px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
.hero .lbl{font-size:13px;color:var(--muted);margin:0 0 4px}
.hero .name{font-size:34px;line-height:1;font-weight:900;font-stretch:80%;letter-spacing:-.02em;margin:0 0 8px}
.hero .ex{font-size:14px;color:var(--muted);margin:0 0 14px;line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:10px 12px}
.stat .v{font-size:22px;font-weight:800;font-stretch:85%;line-height:1.1}
.stat .k{font-size:12px;color:var(--muted);margin-top:2px}
/* exercise block in workout */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 10px;margin-bottom:10px;box-shadow:var(--shadow)}
.ex .hd{display:flex;align-items:flex-start;gap:10px}
.ex .num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--surface2);color:var(--muted);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px}
.ex h3{margin:0;font-size:18px;font-weight:700;line-height:1.2}
.ex .target{font-size:13px;color:var(--muted);margin:3px 0 0}
.ex .last{font-size:14px;margin:10px 0 2px}
.ex .last b{font-weight:700}
.ex .best{font-size:13px;color:var(--muted);margin:0 0 8px}
.hint{font-size:13px;margin:0 0 10px;padding:6px 10px;border-radius:8px;font-weight:600;background:var(--surface2)}
.hint.up{background:var(--good-soft);color:var(--good)} .hint.hold{background:var(--accent-soft);color:var(--accent)} .hint.down{background:var(--bad-soft);color:var(--bad)}
.sets{display:grid;grid-template-columns:26px 1fr 1fr 1fr 46px;gap:6px;align-items:center}
.sets .h{font-size:12px;color:var(--muted);padding-left:4px}
.sets .n{font-size:13px;color:var(--muted);text-align:center}
.sets input{text-align:center;padding:8px 2px;min-height:44px;font-weight:600}
.sets input.srow-done{background:var(--good-soft);border-color:transparent}
.sets .ok{border:1px solid var(--line2);border-radius:var(--r2);background:transparent;min-height:44px;font-size:18px;color:var(--muted)}
.sets .ok.done{background:var(--good);color:#fff;border-color:transparent}
.ex .foot{display:flex;gap:14px;margin-top:10px;font-size:13px}
.ex .foot button{background:none;border:none;padding:0;color:var(--accent);font-weight:600;font-size:13px}
.menu{background:none;border:none;font-size:22px;line-height:1;padding:0 4px;color:var(--muted)}
/* timer */
.timer{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:20;display:none}
.timer.on{display:block}
.timer .in{max-width:600px;margin:0 auto;background:var(--text);color:var(--bg);padding:12px 14px;display:flex;align-items:center;gap:12px;border-radius:0 0 14px 14px;position:relative}
.timer .t{font-size:32px;font-weight:900;font-stretch:80%;min-width:88px;line-height:1}
.timer button{background:transparent;border:1px solid rgba(128,128,128,.5);color:inherit;border-radius:8px;padding:6px 10px;min-height:36px}
.timer .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);transition:width 1s linear}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:0 0 env(safe-area-inset-bottom,0px);z-index:15}
nav .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{background:none;border:none;padding:8px 2px 6px;font-size:11px;color:var(--muted);min-height:54px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent);font-weight:700}
.savebar{position:fixed;left:0;right:0;bottom:60px;padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:14}
.savebar .in{max-width:600px;margin:0 auto;display:flex;gap:8px;pointer-events:auto}
.savebar .btn{flex:1;box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(124px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:90%;text-align:center}
.toast.show{opacity:1}
svg.chart{width:100%;height:auto;display:block}
.chart text{font-family:inherit;font-size:11px;fill:var(--muted)}
.chart .ax{stroke:var(--line)} .chart .ln{fill:none;stroke:var(--accent);stroke-width:2.2} .chart .dot{fill:var(--accent)}
pre.log{white-space:pre-wrap;font:14px/1.45 inherit;background:var(--surface2);border:1px solid var(--line);border-radius:var(--r2);padding:10px;max-height:50vh;overflow:auto;margin:0 0 10px}
.hidden{display:none}
.search{margin-bottom:8px}
.grp{font-size:13px;color:var(--muted);margin:12px 0 4px}
.tpl-item{display:grid;grid-template-columns:1fr 48px 48px 48px 48px 28px;gap:4px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.tpl-item input{padding:6px 2px;min-height:38px;text-align:center}
.tpl-item .x{background:none;border:none;color:var(--muted);font-size:18px}
.tpl-head{display:grid;grid-template-columns:1fr 48px 48px 48px 48px 28px;gap:4px;font-size:11px;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.modal .box{background:var(--surface);width:100%;max-width:600px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px))}
.cmp{display:grid;grid-template-columns:1fr auto auto;gap:6px 12px;align-items:center;font-size:14px}
.cmp .h{font-size:12px;color:var(--muted)}
.cmp .up{color:var(--good);font-weight:700} .cmp .eq{color:var(--muted)} .cmp .dn{color:var(--bad);font-weight:700}
.sync{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){.toast,.timer .bar{transition:none}}
</style>

<script>
// ============ библиотека ============
const LIB = [
 ['bench','Жим штанги лёжа','Грудь'],['dbbench','Жим гантелей лёжа','Грудь'],['incbar','Жим штанги на наклонной','Грудь'],['incdb','Жим гантелей на наклонной','Грудь'],['machpress','Жим в тренажёре','Грудь'],['dips','Брусья','Грудь'],['cgbench','Жим узким хватом','Грудь'],['lowfly','Сведения на блоке снизу вверх','Грудь'],['fly','Разводка гантелей на наклонной','Грудь'],['pecdeck','Бабочка','Грудь'],['pushup','Отжимания','Грудь'],
 ['pullup','Подтягивания','Спина'],['latpd','Тяга верхнего блока','Спина'],['latpdn','Тяга верхнего блока узким нейтральным хватом','Спина'],['cablerow','Тяга горизонтального блока к поясу','Спина'],['csrow','Тяга лёжа грудью на скамье','Спина'],['dbrow','Тяга гантели одной рукой в упоре','Спина'],['bbrow','Тяга штанги в наклоне','Спина'],['pullover','Пуловер на блоке','Спина'],['deadlift','Становая тяга','Спина'],['trapbar','Становая с трэп-грифом','Спина'],['hyper','Гиперэкстензия','Спина'],
 ['ohp','Жим штанги стоя','Плечи'],['dbohp','Жим гантелей сидя','Плечи'],['latraise','Махи гантелей в стороны','Плечи'],['cablelat','Махи на блоке','Плечи'],['facepull','Тяга каната к лицу','Плечи'],['reardelt','Разведения на заднюю дельту','Плечи'],
 ['curl','Сгибания на бицепс со штангой','Руки'],['dbcurl','Сгибания на бицепс с гантелями','Руки'],['hammer','Молотки','Руки'],['tri','Разгибания на трицепс на блоке','Руки'],['skull','Французский жим','Руки'],['ohtri','Разгибания из-за головы','Руки'],
 ['squat','Присед со штангой','Ноги'],['front','Фронтальный присед','Ноги'],['msquat','Присед в тренажёре','Ноги'],['hack','Гакк-присед','Ноги'],['smith','Присед в Смите','Ноги'],['legpress','Жим ногами','Ноги'],['rdl','Румынская тяга','Ноги'],['legcurl','Сгибания ног лёжа','Ноги'],['seatcurl','Сгибания ног сидя','Ноги'],['legext','Разгибания ног','Ноги'],['bulg','Болгарские выпады','Ноги'],['lunge','Выпады','Ноги'],['glute','Ягодичный мост в тренажёре','Ноги'],['hipthrust','Ягодичный мост со штангой','Ноги'],['calf','Подъёмы на носки стоя','Ноги'],['scalf','Подъёмы на носки сидя','Ноги'],
 ['pallof','Антиротация на блоке','Кор'],['kneeraise','Подъёмы коленей в висе','Кор'],['cablecrunch','Скручивания на блоке','Кор'],['plank','Планка','Кор'],['sideplank','Боковая планка','Кор'],
];
const GROUPS=['Грудь','Спина','Плечи','Руки','Ноги','Кор','Другое'];
// согласованная программа: [exId, подходы, повт.от, повт.до, RIR, отдых сек]
const DEFAULT_TEMPLATES = [
 {id:'u1',name:'Верх — сила',kind:'s',items:[['bench',3,5,5,3,180],['dbrow',3,6,8,2,120],['incbar',3,6,8,2,150],['cablerow',3,8,10,2,90],['dbohp',3,6,8,2,120],['dips',3,8,10,2,90]]},
 {id:'l1',name:'Низ — сила',kind:'s',items:[['msquat',3,6,8,3,180],['legcurl',3,10,12,2,90],['legext',3,12,15,1,60],['hyper',2,12,12,3,60],['pallof',2,12,12,2,60]]},
 {id:'u2',name:'Верх — объём',kind:'v',items:[['incdb',3,8,10,2,120],['pullup',3,6,10,2,120],['lowfly',3,12,15,1,75],['latpdn',3,10,12,1,90],['latraise',3,12,15,1,60],['dbcurl',3,10,12,1,60]]},
 {id:'l2',name:'Низ — объём',kind:'v',items:[['legpress',3,8,10,2,150],['glute',3,10,10,2,90],['seatcurl',3,12,15,1,60],['legext',3,12,15,1,60],['calf',3,10,12,1,60],['facepull',3,15,15,1,60]]},
].map(t=>({id:t.id,name:t.name,kind:t.kind,items:t.items.map(([exId,sets,min,max,rir,rest])=>({exId,sets,min,max,rir,rest}))}));
const VERSION=3;

// ============ состояние ============
const KEY='gym_tracker_v3', OLD_KEY='gym_tracker_v2';
function freshState(){ const ex={}; LIB.forEach(([id,name,group])=>ex[id]={id,name,group}); return {version:VERSION,exercises:ex,templates:JSON.parse(JSON.stringify(DEFAULT_TEMPLATES)),workouts:[],mornings:[],active:null,settings:{rest:120,startDate:'2026-10-20'},updatedAt:0}; }
let state=freshState();
function adopt(p){ if(!p||typeof p!=='object') return false; const f=freshState();
  const s={...f,...p}; s.exercises={...f.exercises,...(p.exercises||{})}; s.settings={...f.settings,...(p.settings||{})};
  if((p.version||2)<3){ s.templates=JSON.parse(JSON.stringify(DEFAULT_TEMPLATES)); } // программа пересогласована
  s.version=VERSION; s.workouts=(s.workouts||[]).slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0); state=s; return true; }
try{ const raw=localStorage.getItem(KEY)||localStorage.getItem(OLD_KEY); if(raw&&adopt(JSON.parse(raw))) localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){}

// ============ Telegram + CloudStorage (по секциям) ============
const TG=window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.initData!==undefined?window.Telegram.WebApp:null;
const CLOUD=TG&&TG.CloudStorage&&TG.isVersionAtLeast&&TG.isVersionAtLeast('6.9')?TG.CloudStorage:null;
if(TG){ try{ TG.ready(); TG.expand(); if(TG.colorScheme) document.documentElement.setAttribute('data-theme',TG.colorScheme); TG.onEvent&&TG.onEvent('themeChanged',()=>document.documentElement.setAttribute('data-theme',TG.colorScheme)); }catch(e){} }
const CHUNK=3800; const dirty=new Set(); let cloudBusy=false, cloudTimer=null, cloudState='off';
const monthOf=iso=>'wm'+iso.slice(0,7).replace('-','_');
function sectionData(sec){
  if(sec==='meta'){ const custom={}; Object.values(state.exercises).forEach(e=>{ if(e.custom||e.renamed) custom[e.id]=e; }); return {version:VERSION,settings:state.settings,templates:state.templates,exercises:custom,active:state.active,updatedAt:state.updatedAt}; }
  if(sec==='morn') return state.mornings;
  return state.workouts.filter(w=>monthOf(w.date)===sec);
}
function cloudSaveSoon(){ if(!CLOUD) return; clearTimeout(cloudTimer); cloudTimer=setTimeout(cloudSave,1200); }
function cloudSave(){
  if(!CLOUD||cloudBusy||!dirty.size) return; cloudBusy=true; setSync('sync');
  const secs=[...dirty]; dirty.clear(); let si=0;
  const fail=e=>{ secs.forEach(s=>dirty.add(s)); cloudBusy=false; setSync('err'); console.warn('cloud',e); };
  const nextSec=()=>{ if(si>=secs.length){ cloudBusy=false; setSync(dirty.size?'sync':'ok'); if(dirty.size) cloudSaveSoon(); return; }
    const sec=secs[si++]; const json=JSON.stringify(sectionData(sec)); const n=json.length?Math.ceil(json.length/CHUNK):0; let i=0;
    const writeChunk=()=>{ if(i<n){ const v=json.slice(i*CHUNK,(i+1)*CHUNK); const k=sec+'__'+i; i++; CLOUD.setItem(k,v,err=>err?fail(err):writeChunk()); }
      else CLOUD.setItem(sec+'__n',String(n),err=>{ if(err) return fail(err);
        CLOUD.getKeys((e,keys)=>{ const stale=(keys||[]).filter(k=>k.startsWith(sec+'__')&&k!==sec+'__n'&&+k.slice(sec.length+2)>=n); if(stale.length) CLOUD.removeItems(stale,()=>nextSec()); else nextSec(); }); }); };
    writeChunk(); };
  nextSec();
}
function cloudLoad(){ if(!CLOUD){ setSync('off'); return; } setSync('sync');
  CLOUD.getKeys((err,keys)=>{ if(err||!keys){ setSync('err'); return; }
    const secs={}; keys.forEach(k=>{ const m=k.match(/^(.+)__(n|\d+)$/); if(!m) return; secs[m[1]]=secs[m[1]]||{chunks:[]}; if(m[2]==='n') secs[m[1]].hasN=true; else secs[m[1]].chunks.push(k); });
    const names=Object.keys(secs).filter(s=>secs[s].hasN);
    if(!names.length){ if(keys.includes('gym_meta')) return migrateOldCloud(keys);
      if(state.updatedAt||state.workouts.length){ markAll(); cloudSaveSoon(); } setSync('ok'); return; }
    const all=keys.filter(k=>/__(\d+|n)$/.test(k)); CLOUD.getItems(all,(e2,items)=>{ if(e2||!items){ setSync('err'); return; }
      const parsed={}; names.forEach(sec=>{ const n=+items[sec+'__n']||0; let json=''; for(let i=0;i<n;i++) json+=items[sec+'__'+i]||''; try{ parsed[sec]=json?JSON.parse(json):null; }catch(x){} });
      const meta=parsed.meta; const cloudUpdated=meta&&meta.updatedAt||0;
      if(cloudUpdated>=(state.updatedAt||0)||(!state.workouts.length&&!state.updatedAt)){
        const f=freshState(); const s={...f};
        if(meta){ s.settings={...f.settings,...(meta.settings||{})}; s.templates=meta.templates||f.templates; s.exercises={...f.exercises,...(meta.exercises||{})}; s.active=meta.active||null; s.updatedAt=cloudUpdated; }
        s.mornings=parsed.morn||[]; s.workouts=[]; names.forEach(sec=>{ if(sec.startsWith('wm')&&Array.isArray(parsed[sec])) s.workouts=s.workouts.concat(parsed[sec]); });
        s.workouts.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0); state=s; try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(x){}
        render(); } else { markAll(); cloudSaveSoon(); }
      setSync('ok'); }); }); }
function migrateOldCloud(keys){ CLOUD.getItem('gym_meta',(e,v)=>{ try{ const meta=JSON.parse(v); const ks=Array.from({length:meta.n},(_,i)=>'gym_'+i); CLOUD.getItems(ks,(e2,items)=>{ try{ const p=JSON.parse(ks.map(k=>items[k]||'').join('')); if((p.updatedAt||0)>=(state.updatedAt||0)) adopt(p); }catch(x){} markAll(); cloudSaveSoon(); CLOUD.removeItems(keys.filter(k=>k.startsWith('gym_')),()=>{}); setSync('ok'); render(); }); }catch(x){ setSync('err'); } }); }
function markAll(){ dirty.add('meta'); dirty.add('morn'); new Set(state.workouts.map(w=>monthOf(w.date))).forEach(m=>dirty.add(m)); }
function setSync(s){ cloudState=s; const el=document.getElementById('syncbadge'); if(el) el.textContent={off:'',sync:'синхронизация…',ok:'синхронизировано с Telegram',err:'не синхронизировано'}[s]; }
function save(secs){ state.updatedAt=Date.now(); try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){ toast('Не удалось сохранить: память браузера'); } (secs||[]).forEach(s=>dirty.add(s)); dirty.add('meta'); cloudSaveSoon(); }

// ============ утилиты ============
let tab='home', sub=null;
const pad=n=>String(n).padStart(2,'0');
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const fmtD=iso=>iso.slice(8,10)+'.'+iso.slice(5,7);
const fmtDY=iso=>iso.slice(8,10)+'.'+iso.slice(5,7)+'.'+iso.slice(0,4);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function e1rm(w,r){ return r>=1?Math.round(w*(1+r/30)*2)/2:w; }
function setStr(s){ return (s.w!=null?s.w:'—')+'×'+(s.r!=null?s.r:'—')+(s.rir!=null?' RIR '+s.rir:''); }
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),2200); }
function exName(id){ return state.exercises[id]?state.exercises[id].name:id; }
function doneSets(item){ return item.sets.filter(s=>s.w!=null&&s.r!=null); }
function lastSession(exId, excludeId){ for(let i=state.workouts.length-1;i>=0;i--){ const w=state.workouts[i]; if(w.id===excludeId) continue; const it=w.items.find(x=>x.exId===exId); if(it&&doneSets(it).length) return {w,it}; } return null; }
function bestOf(exId, excludeId){ let best=null; state.workouts.forEach(w=>{ if(w.id===excludeId) return; w.items.forEach(it=>{ if(it.exId!==exId) return; doneSets(it).forEach(s=>{ const v=e1rm(s.w,s.r); if(!best||v>best.v) best={v,w:s.w,r:s.r,date:w.date}; }); }); }); return best; }
function topSet(sets){ let b=null; sets.forEach(s=>{ const v=e1rm(s.w,s.r); if(!b||v>b.v) b={...s,v}; }); return b; }
function fmtTime(sec){ return Math.floor(sec/60)+':'+pad(sec%60); }
function weekOf(iso){ const s=new Date((state.settings.startDate||iso)+'T00:00:00'), t=new Date(iso+'T00:00:00'); return Math.floor((t-s)/864e5/7)+1; }
function weekNote(w){ if(w<1) return ''; if(w<=4) return 'неделя '+w+' из 5, базовые RIR '+[3,2,2,1][w-1]; if(w===5) return 'неделя 5: deload — веса недели 3, половина подходов, RIR 4–5'; return 'цикл завершён — пришли лог тренеру'; }
function suggestion(item){
  const last=lastSession(item.exId, state.active&&state.active.id); if(!last) return {cls:'',text:'Первый раз: найди вес на RIR '+(item.rir!=null?item.rir:2)};
  const sets=doneSets(last.it), l=sets[sets.length-1], f=sets[0];
  if(f.r-l.r>=2) return {cls:'down',text:'В прошлый раз повторы упали на '+(f.r-l.r)+' — вес был выше RIR. Тот же вес, отдых дольше'};
  if(item.max&&item.rir!=null){
    const allTop=sets.length>=(item.target||item.sets.length)&&sets.every(s=>s.r>=item.max);
    if(l.rir!=null&&l.rir<item.rir-1) return {cls:'down',text:'Последний подход RIR '+l.rir+' при цели '+item.rir+' — вес не повышать'};
    if(allTop&&(l.rir==null||l.rir>=item.rir)) return {cls:'up',text:'Все '+sets.length+' по '+item.max+' — повышай вес'};
    if(!allTop) return {cls:'hold',text:'Тот же вес, добирай до '+item.max+' во всех подходах'};
    return {cls:'hold',text:'Повторы есть, RIR ниже цели — повтори вес'};
  }
  return {cls:'',text:''};
}

function pickExercise(onPick){
  const draw=q=>{ const ql=(q||'').toLowerCase().trim(); const words=ql.split(/\s+/).filter(Boolean); const list=Object.values(state.exercises).filter(e=>!words.length||words.every(wd=>e.name.toLowerCase().includes(wd)));
    let h=`<input class="search" id="exq" placeholder="Поиск или новое название" value="${esc(q||'')}" autocomplete="off">`;
    GROUPS.forEach(g=>{ const gs=list.filter(e=>e.group===g); if(!gs.length) return; h+=`<p class="grp">${g}</p><div class="chips">${gs.map(e=>`<button class="chip" data-pick="${e.id}">${esc(e.name)}</button>`).join('')}</div>`; });
    if(ql&&!list.some(e=>e.name.toLowerCase()===ql)) h+=`<button class="btn wide" style="margin-top:12px" id="newEx">Создать «${esc(q.trim())}»</button>`;
    document.getElementById('modalBox').innerHTML=h; const inp=document.getElementById('exq'); inp.oninput=()=>{ const pos=inp.selectionStart; draw(inp.value); const i2=document.getElementById('exq'); i2.focus(); i2.setSelectionRange(pos,pos); };
    document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>onPick(b.dataset.pick));
    const ne=document.getElementById('newEx'); if(ne) ne.onclick=()=>{ const g=prompt('Группа: '+GROUPS.join(', '),'Другое'); const id='c'+uid(); state.exercises[id]={id,name:q.trim(),group:GROUPS.includes(g)?g:'Другое',custom:true}; save(); onPick(id); }; };
  document.getElementById('modal').classList.add('on'); draw('');
}

// ---- история ----
function renderHistory(v){
  const ws=[...state.workouts].reverse();
  v.innerHTML=`<h1 class="big">История</h1><p class="m small" style="margin:0 0 10px">${state.workouts.length} тренировок${state.workouts.length?', последняя '+fmtD(ws[0].date):''}</p>
    ${ws.length?`<ul class="list card" style="padding:4px 14px">${ws.map(w=>`<li class="tap" data-open="${w.id}"><div class="t"><b>${esc(w.name)}</b><span class="m small">${fmtDY(w.date)}</span></div><div class="small m">${w.items.map(it=>{const t=topSet(it.sets);return exName(it.exId)+' '+t.w+'×'+t.r;}).join(' · ')}</div></li>`).join('')}</ul>`:'<p class="empty">Пока пусто.</p>'}`;
  v.querySelectorAll('[data-open]').forEach(li=>li.onclick=()=>{ sub={kind:'workout',id:li.dataset.open}; render(); });
}
function renderWorkoutDetail(v,id){
  const w=state.workouts.find(x=>x.id===id); if(!w){ sub=null; return render(); }
  v.innerHTML=topbar(fmtDY(w.date),'history')+`<h1 class="big">${esc(w.name)}</h1><p class="m small">${w.duration?w.duration+' мин, ':''}поясница ${w.back!=null?w.back:'—'}${w.notes?'. '+esc(w.notes):''}</p>
    <ul class="list card" style="padding:4px 14px">${w.items.map(it=>`<li class="tap" data-ex="${it.exId}"><div class="t"><b>${esc(exName(it.exId))}</b><span class="m small">1RM≈${topSet(it.sets).v}</span></div><div class="small">${it.sets.map(setStr).join(', ')}${it.note?'<div class="m">'+esc(it.note)+'</div>':''}</div></li>`).join('')}</ul>
    <div class="row"><button class="btn" id="repeat">Повторить</button><button class="btn danger" id="delw">Удалить</button></div>`;
  v.querySelector('[data-back]').onclick=()=>{ sub=null; tab='history'; render(); };
  v.querySelectorAll('[data-ex]').forEach(li=>li.onclick=()=>{ sub={kind:'exercise',id:li.dataset.ex}; render(); });
  document.getElementById('delw').onclick=()=>{ if(confirm('Удалить тренировку?')){ state.workouts=state.workouts.filter(x=>x.id!==id); save([monthOf(w.date)]); sub=null; render(); } };
  document.getElementById('repeat').onclick=()=>{ if(state.active&&!confirm('Есть незавершённая тренировка. Заменить?')) return; const tpl={id:w.templateId,name:w.name,kind:w.kind,items:w.items.map(it=>({exId:it.exId,sets:it.sets.length,min:it.min,max:it.max,rir:it.rir,rest:it.rest}))}; startWorkout(tpl); };
}

// ---- упражнения ----
let exq='';
function renderExercises(v){
  const ql=exq.toLowerCase(); const used={}; state.workouts.forEach(w=>w.items.forEach(it=>used[it.exId]=w.date));
  const all=Object.values(state.exercises).filter(e=>!ql||e.name.toLowerCase().includes(ql));
  let h=`<h1 class="big">Упражнения</h1><input class="search" id="exsearch" placeholder="Поиск" value="${esc(exq)}">`;
  GROUPS.forEach(g=>{ const gs=all.filter(e=>e.group===g).sort((a,b)=>(used[b.id]||'')>(used[a.id]||'')?1:-1); if(!gs.length) return;
    h+=`<p class="grp">${g}</p><ul class="list card" style="padding:4px 14px">${gs.map(e=>{ const b=bestOf(e.id); return `<li class="tap" data-ex="${e.id}"><div class="t"><span>${esc(e.name)}</span><span class="m small">${b?b.w+'×'+b.r+' · '+fmtD(used[e.id]):''}</span></div></li>`; }).join('')}</ul>`; });
  v.innerHTML=h;
  const inp=document.getElementById('exsearch'); inp.oninput=()=>{ exq=inp.value; const pos=inp.selectionStart; render(); const i2=document.getElementById('exsearch'); i2.focus(); i2.setSelectionRange(pos,pos); };
  v.querySelectorAll('[data-ex]').forEach(li=>li.onclick=()=>{ sub={kind:'exercise',id:li.dataset.ex}; render(); });
}
function chart(points){
  if(points.length<2) return '<p class="empty">Нужно минимум две записи.</p>';
  const W=560,H=170,L=36,R=10,T=14,B=26; const ys=points.map(p=>p.y); let mn=Math.min(...ys),mx=Math.max(...ys); if(mx-mn<1){mn-=0.5;mx+=0.5;}
  const x=i=>L+(W-L-R)*i/(points.length-1), y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn)); const step=Math.max(1,Math.ceil(points.length/6));
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"><line class="ax" x1="${L}" y1="${y(mn)}" x2="${W-R}" y2="${y(mn)}"/><text x="2" y="${y(mx)+4}">${mx}</text><text x="2" y="${y(mn)+4}">${mn}</text>
    <path class="ln" d="${points.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.y).toFixed(1)).join(' ')}"/>
    ${points.map((p,i)=>`<circle class="dot" cx="${x(i)}" cy="${y(p.y)}" r="3"/>${i%step===0||i===points.length-1?`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${fmtD(p.date)}</text>`:''}`).join('')}</svg>`;
}
function renderExercise(v,id){
  const e=state.exercises[id]; if(!e){ sub=null; return render(); }
  const sessions=[]; state.workouts.forEach(w=>w.items.forEach(it=>{ if(it.exId===id&&it.sets.length) sessions.push({w,it}); }));
  const pts=sessions.map(s=>({date:s.w.date,y:topSet(s.it.sets).v})); const best=bestOf(id); const bw=sessions.length?Math.max(...sessions.flatMap(s=>s.it.sets.map(x=>x.w))):null;
  v.innerHTML=topbar(e.group,tab)+`<h1 class="big">${esc(e.name)}</h1>
    <p class="small m" style="margin:0 0 10px">${best?'Лучший подход '+best.w+'×'+best.r+' (1RM≈'+best.v+'), макс. вес '+bw+' кг, сессий: '+sessions.length:'Ещё не делал'}</p>
    <section class="card"><h2>Расчётный 1RM</h2>${chart(pts)}</section>
    ${sessions.length?`<ul class="list card" style="padding:4px 14px">${[...sessions].reverse().slice(0,40).map(s=>`<li class="tap" data-w="${s.w.id}"><div class="t"><span>${fmtDY(s.w.date)}</span><span class="m small">${esc(s.w.name)}</span></div><div class="small">${s.it.sets.map(setStr).join(', ')}</div></li>`).join('')}</ul>`:''}
    <div class="row"><button class="btn" id="renEx">Переименовать</button>${e.custom?'<button class="btn danger" id="delEx">Удалить</button>':''}</div>`;
  v.querySelector('[data-back]').onclick=()=>{ sub=null; render(); };
  v.querySelectorAll('[data-w]').forEach(li=>li.onclick=()=>{ sub={kind:'workout',id:li.dataset.w}; render(); });
  document.getElementById('renEx').onclick=()=>{ const n=prompt('Название',e.name); if(n){ e.name=n.trim(); e.renamed=true; save(); render(); } };
  const d=document.getElementById('delEx'); if(d) d.onclick=()=>{ if(sessions.length){ toast('Есть записи — удалить нельзя'); return; } delete state.exercises[id]; save(); sub=null; render(); };
}

// ---- тело ----
function renderBody(v){
  const t=todayISO(); const ex=state.mornings.find(m=>m.date===t)||{}; const last14=[...state.mornings].slice(-14).reverse();
  const mean=a=>a.length?a.reduce((s,m)=>s+m.weight,0)/a.length:null; const a1=mean(state.mornings.slice(-7)),a0=mean(state.mornings.slice(-14,-7));
  v.innerHTML=`<h1 class="big">Тело</h1><section class="card"><h2>Утро, натощак</h2>
    <div class="row"><div><label class="f">Дата</label><input type="date" id="mdate" value="${ex.date||t}"></div><div><label class="f">Вес, кг</label><input type="number" inputmode="decimal" step="0.1" id="mw" value="${ex.weight!=null?ex.weight:''}"></div></div>
    <div class="row" style="margin-top:8px"><div><label class="f">Сон, ч</label><input type="number" inputmode="decimal" step="0.5" id="ms" value="${ex.sleep!=null?ex.sleep:''}"></div><div><label class="f">Поясница 0–10</label><input type="number" inputmode="numeric" min="0" max="10" id="mb" value="${ex.back!=null?ex.back:''}"></div></div>
    <button class="btn primary wide" style="margin-top:10px" id="msave">Записать</button></section>
    <section class="card"><h2>Вес тела</h2>${chart(state.mornings.map(m=>({date:m.date,y:m.weight})))}<p class="small" style="margin:8px 0 0">${a1!=null&&a0!=null?'Среднее за 7 дней '+a1.toFixed(1)+' кг, неделей раньше '+a0.toFixed(1)+': '+(a1-a0>=0?'+':'')+(a1-a0).toFixed(1)+' кг/нед':'Тренд — после 14 взвешиваний.'}</p></section>
    ${last14.length?`<ul class="list card" style="padding:4px 14px">${last14.map(m=>`<li><div class="t"><span>${fmtD(m.date)}</span><span><b>${m.weight} кг</b> <span class="m small">сон ${m.sleep!=null?m.sleep:'—'} ч, поясница ${m.back!=null?m.back:'—'}</span></span></div></li>`).join('')}</ul>`:''}`;
  document.getElementById('msave').onclick=()=>{ const d=document.getElementById('mdate').value, wt=document.getElementById('mw').value; if(!d||wt===''){ toast('Нужны дата и вес'); return; }
    const num=i=>{const x=document.getElementById(i).value;return x===''?null:Number(x);};
    state.mornings=state.mornings.filter(m=>m.date!==d); state.mornings.push({date:d,weight:Number(wt),sleep:num('ms'),back:num('mb')}); state.mornings.sort((a,b)=>a.date<b.date?-1:1); save(['morn']); toast('Записано'); render(); };
}

// ---- ещё ----
function renderMore(v){
  v.innerHTML=`<h1 class="big">Ещё</h1>
    <section class="card"><h2>Шаблоны тренировок</h2>${state.templates.length?`<ul class="list">${state.templates.map(t=>`<li class="tap" data-tpl="${t.id}"><div class="t"><b>${esc(t.name)}</b><span class="m small">${t.items.length} упр.</span></div></li>`).join('')}</ul>`:'<p class="empty">Нет шаблонов.</p>'}
      <div class="row" style="margin-top:8px"><button class="btn" id="newTpl">+ Новый шаблон</button><button class="btn ghost" id="resetTpl">Вернуть программу</button></div></section>
    <section class="card"><h2>Лог для тренера</h2><p class="small m" style="margin:0 0 8px">Текст за 7/14/35 дней — отправить в чат или скопировать.</p><button class="btn wide" id="openLog">Открыть лог</button></section>
    <section class="card"><h2>Настройки</h2><div class="row"><div><label class="f">Отдых по умолчанию, сек</label><input type="number" inputmode="numeric" id="restDef" value="${state.settings.rest}"></div><div><label class="f">Старт мезоцикла</label><input type="date" id="sd" value="${state.settings.startDate||''}"></div></div></section>
    <section class="card"><h2>Данные</h2><p class="small" style="margin:0 0 8px" id="syncbadge"></p><div class="row"><button class="btn" id="exp">Экспорт JSON</button><button class="btn" id="imp">Импорт JSON</button></div><textarea id="json" class="hidden" style="margin-top:8px" rows="4" placeholder="Вставь JSON и нажми «Импорт» ещё раз"></textarea>
      <p class="tiny m" style="margin:8px 0 0">${CLOUD?'Хранится в Telegram CloudStorage — доступно с любого устройства, где ты вошёл в этот аккаунт. Раз в месяц — экспорт себе в Избранное на всякий случай.':'Данные живут только в этом браузере. Раз в неделю — экспорт и отправь себе в Telegram.'}</p></section>`;
  setSync(cloudState);
  v.querySelectorAll('[data-tpl]').forEach(li=>li.onclick=()=>{ sub={kind:'template',id:li.dataset.tpl}; render(); });
  document.getElementById('newTpl').onclick=()=>{ const t={id:'t'+uid(),name:'Новый шаблон',kind:null,items:[]}; state.templates.push(t); save(); sub={kind:'template',id:t.id}; render(); };
  document.getElementById('resetTpl').onclick=()=>{ if(confirm('Заменить шаблоны на согласованную программу Верх/Низ?')){ state.templates=JSON.parse(JSON.stringify(DEFAULT_TEMPLATES)); save(); render(); } };
  document.getElementById('openLog').onclick=()=>{ sub={kind:'log'}; render(); };
  document.getElementById('restDef').onchange=e=>{ state.settings.rest=Math.max(10,+e.target.value||120); save(); };
  document.getElementById('sd').onchange=e=>{ state.settings.startDate=e.target.value; save(); };
  document.getElementById('exp').onclick=async()=>{ const ta=document.getElementById('json'); ta.classList.remove('hidden'); ta.value=JSON.stringify(state); try{ await navigator.clipboard.writeText(ta.value); toast('JSON скопирован'); }catch(e){ if(!shareText(ta.value)) toast('JSON в поле ниже — выдели и скопируй'); } };
  document.getElementById('imp').onclick=()=>{ const ta=document.getElementById('json'); if(ta.classList.contains('hidden')){ ta.classList.remove('hidden'); ta.value=''; ta.focus(); return; }
    try{ const p=JSON.parse(ta.value); if(!p||!Array.isArray(p.workouts)) throw 0; if(!confirm('Заменить все данные на импортируемые?')) return; adopt(p); markAll(); save(); toast('Импортировано'); render(); }catch(e){ toast('Это не JSON этого трекера'); } };
}
function renderTemplateEdit(v,id){
  const t=state.templates.find(x=>x.id===id); if(!t){ sub=null; return render(); }
  v.innerHTML=topbar('Шаблон','more')+`<input id="tname" value="${esc(t.name)}" style="font-size:20px;font-weight:700;margin-bottom:8px">
    <div class="chips" style="margin-bottom:10px"><button class="chip ${t.kind==='s'?'on':''}" data-kind="s">сила</button><button class="chip ${t.kind==='v'?'on':''}" data-kind="v">объём</button></div>
    <section class="card"><div class="tpl-head"><span>Упражнение</span><span>подх.</span><span>от</span><span>до</span><span>RIR</span><span></span></div>
    ${t.items.map((it,i)=>`<div class="tpl-item" data-i="${i}"><span>${esc(exName(it.exId))}<br><span class="tiny m">отдых <input type="number" data-f="rest" value="${it.rest||''}" style="width:58px;display:inline;min-height:28px;padding:2px"> с</span></span>
      <input type="number" inputmode="numeric" data-f="sets" value="${it.sets}"><input type="number" inputmode="numeric" data-f="min" value="${it.min!=null?it.min:''}"><input type="number" inputmode="numeric" data-f="max" value="${it.max!=null?it.max:''}"><input type="number" inputmode="numeric" data-f="rir" value="${it.rir!=null?it.rir:''}"><button class="x" data-del="${i}">×</button></div>`).join('')}
    <button class="btn wide ghost" style="margin-top:10px" id="tAdd">+ Упражнение</button></section>
    <div class="row"><button class="btn primary" id="tStart">Начать по шаблону</button><button class="btn danger" id="tDel">Удалить шаблон</button></div>`;
  v.querySelector('[data-back]').onclick=()=>{ sub=null; tab='more'; render(); };
  document.getElementById('tname').oninput=e=>{ t.name=e.target.value; save(); };
  v.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{ t.kind=t.kind===b.dataset.kind?null:b.dataset.kind; save(); render(); });
  v.querySelectorAll('.tpl-item input').forEach(inp=>inp.onchange=()=>{ const it=t.items[+inp.closest('.tpl-item').dataset.i]; it[inp.dataset.f]=inp.value===''?null:Number(inp.value); if(inp.dataset.f==='sets') it.sets=Math.max(1,it.sets||1); save(); });
  v.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ t.items.splice(+b.dataset.del,1); save(); render(); });
  document.getElementById('tAdd').onclick=()=>pickExercise(exId=>{ t.items.push({exId,sets:3,min:8,max:10,rir:2,rest:state.settings.rest}); save(); closeModal(); render(); });
  document.getElementById('tStart').onclick=()=>{ if(state.active&&!confirm('Есть незавершённая тренировка. Заменить?')) return; startWorkout(t); };
  document.getElementById('tDel').onclick=()=>{ if(confirm('Удалить шаблон «'+t.name+'»?')){ state.templates=state.templates.filter(x=>x.id!==id); save(); sub=null; render(); } };
}
let logDays=7;
function buildLog(days){
  const from=new Date(Date.now()-days*864e5); const fromISO=from.getFullYear()+'-'+pad(from.getMonth()+1)+'-'+pad(from.getDate());
  const ws=state.workouts.filter(w=>w.date>=fromISO), ms=state.mornings.filter(m=>m.date>=fromISO);
  let out='Лог за '+days+' дней, '+fmtDY(fromISO)+' – '+fmtDY(todayISO())+'\n'; if(!ws.length) out+='\nТренировок нет.\n';
  ws.forEach(w=>{ out+='\n'+w.name+' — '+fmtD(w.date)+(w.duration?', '+w.duration+' мин':'')+'\n';
    w.items.forEach(it=>{ out+='  '+exName(it.exId)+': '+it.sets.map(setStr).join(', ')+(it.note?' ('+it.note+')':'')+'\n'; });
    out+='  Поясница после: '+(w.back!=null?w.back:'—')+(w.notes?'. '+w.notes.replace(/\n/g,' '):'')+'\n'; });
  if(ms.length){ out+='\nУтро:\n'; ms.forEach(m=>out+='  '+fmtD(m.date)+' — '+m.weight+' кг, сон '+(m.sleep!=null?m.sleep:'—')+' ч, поясница '+(m.back!=null?m.back:'—')+'\n'); }
  return out;
}
function renderLog(v){
  const txt=buildLog(logDays);
  v.innerHTML=topbar('Лог','more')+`<div class="chips" style="margin-bottom:10px">${[7,14,35].map(d=>`<button class="chip ${logDays===d?'on':''}" data-days="${d}">${d} дней</button>`).join('')}</div><pre class="log" id="logtxt">${esc(txt)}</pre>
    <div class="row">${TG?'<button class="btn primary" id="share">Отправить в чат</button>':''}<button class="btn ${TG?'':'primary'}" id="copy">Скопировать</button></div>`;
  v.querySelector('[data-back]').onclick=()=>{ sub=null; tab='more'; render(); };
  v.querySelectorAll('[data-days]').forEach(b=>b.onclick=()=>{ logDays=+b.dataset.days; render(); });
  document.getElementById('copy').onclick=async()=>{ try{ await navigator.clipboard.writeText(txt); toast('Скопировано'); }catch(e){ const r=document.createRange(); r.selectNodeContents(document.getElementById('logtxt')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('Выдели и скопируй вручную'); } };
  const sh=document.getElementById('share'); if(sh) sh.onclick=()=>shareText(txt);
}

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{ tab=b.dataset.tab; sub=null; render(); window.scrollTo(0,0); });
render(); cloudLoad();
</script>
</body>
